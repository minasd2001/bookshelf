{% extends "base.html" %}

{% block title %}Edit profile | Bookshelf{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 520px;">
  <h1 class="page-title mb-3">Edit profile</h1>
  <div class="card-soft">
    <form method="post" enctype="multipart/form-data" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-ink">Save</button>
      <a href="{% url 'profile_detail' user.username %}" class="btn-ink-outline ms-1">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
