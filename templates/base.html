<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bookshelf{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'home' %}">Bookshelf</a>

      <form class="d-flex" action="{% url 'search' %}" method="get" role="search">
        <input class="form-control me-2" type="search" name="q"
              placeholder="Search title or author" value="{{ request.GET.q }}">
        <button class="btn btn-outline-light" type="submit">Search</button>
      </form>

      <div class="d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
          <a class="navbar-text text-decoration-none" href="{% url 'profile_detail' user.username %}">{{ user.username }}</a>
          <form action="{% url 'logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
          </form>
        {% else %}
          <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
          <a class="btn btn-light btn-sm" href="{% url 'register' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
