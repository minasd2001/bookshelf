{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="simple">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bookshelf{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <nav class="site-nav">
    <div class="container d-flex align-items-center gap-3">
      <a class="brand" href="{% url 'home' %}">Book<span>shelf</span></a>

      <form class="nav-search mx-auto" action="{% url 'search' %}" method="get" role="search">
        <input type="search" name="q" placeholder="Search title or author" value="{{ request.GET.q }}">
      </form>

      <div class="d-flex align-items-center gap-3">
        {% if user.is_authenticated %}
          <a class="nav-link-plain" href="{% url 'profile_detail' user.username %}">{{ user.username }}</a>
          <form action="{% url 'logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn-ink-outline btn-small">Log out</button>
          </form>
        {% else %}
          <a class="nav-link-plain" href="{% url 'login' %}">Log in</a>
          <a class="btn-ink btn-small" href="{% url 'register' %}">Sign up</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <div class="container pt-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
