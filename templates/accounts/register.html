{% extends "base.html" %}

{% block title %}Sign up | Bookshelf{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 420px;">
  <h1 class="page-title mb-3">Create an account</h1>
  <div class="card-soft">
    <form method="post" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-ink w-100">Sign up</button>
    </form>
  </div>
  <p class="mt-3 text-muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
