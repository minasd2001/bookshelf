{% extends "base.html" %}

{% block title %}Log in | Bookshelf{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 420px;">
  <h1 class="page-title mb-3">Welcome back</h1>
  <div class="card-soft">
    <form method="post" class="styled-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-ink w-100">Log in</button>
    </form>
  </div>
  <p class="mt-3 text-muted">No account yet? <a href="{% url 'register' %}">Sign up</a></p>
</div>
{% endblock %}
